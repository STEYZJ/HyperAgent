<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>

<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f97316"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
</defs>

<rect width="1500" height="1060" fill="#ffffff"/>
<text x="750.0" y="32" fill="#111827" font-size="22" font-weight="600" text-anchor="middle">业务流程对比图</text>
<text x="750.0" y="62" fill="#6b7280" font-size="13" text-anchor="middle">比较四个系统的主业务闭环：从用户输入到工具执行、评审、归档以及下一轮自动化。</text>
<rect x="60" y="95" width="1410" height="790" rx="10" ry="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="60" y="95" width="1410" height="54" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="76" y="127" fill="#111827" font-size="13" font-weight="600">对比维度</text>
<text x="420.0" y="127" fill="#16a34a" font-size="13" font-weight="600" text-anchor="middle">HyperAgent</text>
<line x1="270" y1="95" x2="270" y2="885" stroke="#d1d5db" stroke-width="1"/>
<text x="720.0" y="127" fill="#2563eb" font-size="13" font-weight="600" text-anchor="middle">Hermes Agent</text>
<line x1="570" y1="95" x2="570" y2="885" stroke="#d1d5db" stroke-width="1"/>
<text x="1020.0" y="127" fill="#9333ea" font-size="13" font-weight="600" text-anchor="middle">Claude Code 参考</text>
<line x1="870" y1="95" x2="870" y2="885" stroke="#d1d5db" stroke-width="1"/>
<text x="1320.0" y="127" fill="#f97316" font-size="13" font-weight="600" text-anchor="middle">DeepSeek Reasonix</text>
<line x1="1170" y1="95" x2="1170" y2="885" stroke="#d1d5db" stroke-width="1"/>
<rect x="60" y="149" width="1410" height="92" rx="0" ry="0" fill="#ffffff" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="182" fill="#111827" font-size="12" font-weight="600">核心闭环</text>
<text x="282" y="170" fill="#6b7280" font-size="10">数据审计→模型推荐→实验→评估→Council→下一轮</text>
<text x="582" y="170" fill="#6b7280" font-size="10">多端对话→AIAgent→工具/子代理→记忆/skill 自改</text>
<text x="582" y="183" fill="#6b7280" font-size="10">进</text>
<text x="882" y="170" fill="#6b7280" font-size="10">开发任务→slash command/plugin→agents/hooks→代</text>
<text x="882" y="183" fill="#6b7280" font-size="10">码/Git 输出</text>
<text x="1182" y="170" fill="#6b7280" font-size="10">cache-stable request→repair→tool</text>
<text x="1182" y="183" fill="#6b7280" font-size="10">dispatch→cost stats</text>
<rect x="60" y="241" width="1410" height="92" rx="0" ry="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="274" fill="#111827" font-size="12" font-weight="600">计划/执行边界</text>
<text x="282" y="262" fill="#6b7280" font-size="10">支持 plan-mode、权限确认、实验 cycle</text>
<text x="582" y="262" fill="#6b7280" font-size="10">工具集、审批、cron、gateway 共享命令</text>
<text x="882" y="262" fill="#6b7280" font-size="10">操作逻辑清晰，权限/命令/插件体验强</text>
<text x="1182" y="262" fill="#6b7280" font-size="10">强调 /apply、plan gate、shell permission</text>
<rect x="60" y="333" width="1410" height="92" rx="0" ry="0" fill="#ffffff" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="366" fill="#111827" font-size="12" font-weight="600">工具调用</text>
<text x="282" y="354" fill="#6b7280" font-size="10">web/skill/shell/training 等受控工具，仍需继续</text>
<text x="282" y="367" fill="#6b7280" font-size="10">打磨稳定性</text>
<text x="582" y="354" fill="#6b7280" font-size="10">工具面广，平台和 terminal backend 丰富</text>
<text x="882" y="354" fill="#6b7280" font-size="10">公开仓库展示工作流，核心闭源不可直接复用</text>
<text x="1182" y="354" fill="#6b7280" font-size="10">工具可靠性、并发、安全和事件记录强</text>
<rect x="60" y="425" width="1410" height="92" rx="0" ry="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="458" fill="#111827" font-size="12" font-weight="600">多 Agent 协作</text>
<text x="282" y="446" fill="#6b7280" font-size="10">HSI Council + subagent runtime，偏科研评审</text>
<text x="582" y="446" fill="#6b7280" font-size="10">delegate/subagents/kanban/swarm 更产品化</text>
<text x="882" y="446" fill="#6b7280" font-size="10">feature-dev/code-review/pr-review 多代理模板</text>
<text x="882" y="459" fill="#6b7280" font-size="10">强</text>
<text x="1182" y="446" fill="#6b7280" font-size="10">subagent/skill 支持，但核心不是大规模协同</text>
<rect x="60" y="517" width="1410" height="92" rx="0" ry="0" fill="#ffffff" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="550" fill="#111827" font-size="12" font-weight="600">结果评审</text>
<text x="282" y="538" fill="#6b7280" font-size="10">OA/AA/Kappa、报告、证据、消融计划</text>
<text x="582" y="538" fill="#6b7280" font-size="10">偏通用任务完成和轨迹生成</text>
<text x="882" y="538" fill="#6b7280" font-size="10">代码审查、PR、commit、issue triage</text>
<text x="1182" y="538" fill="#6b7280" font-size="10">更重 replay/diff/stats 和 cost/cache 透明</text>
<rect x="60" y="609" width="1410" height="92" rx="0" ry="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="642" fill="#111827" font-size="12" font-weight="600">长期积累</text>
<text x="282" y="630" fill="#6b7280" font-size="10">worklog、sessions、usage、research experience</text>
<text x="582" y="630" fill="#6b7280" font-size="10">memory、skills hub、session search、Honcho</text>
<text x="882" y="630" fill="#6b7280" font-size="10">插件/skill/hook 复用，团队设置</text>
<text x="1182" y="630" fill="#6b7280" font-size="10">append-only log、usage、semantic index</text>
<rect x="60" y="701" width="1410" height="92" rx="0" ry="0" fill="#ffffff" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="734" fill="#111827" font-size="12" font-weight="600">领域适配</text>
<text x="282" y="722" fill="#6b7280" font-size="10">最强：HSI 数据/光谱/实验知识内建</text>
<text x="582" y="722" fill="#6b7280" font-size="10">无 HSI 专属科研协议</text>
<text x="882" y="722" fill="#6b7280" font-size="10">无 HSI 专属流程</text>
<text x="1182" y="722" fill="#6b7280" font-size="10">无 HSI 专属流程</text>
<rect x="60" y="793" width="1410" height="92" rx="0" ry="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="0.8"/>
<text x="76" y="826" fill="#111827" font-size="12" font-weight="600">成熟度风险</text>
<text x="282" y="814" fill="#6b7280" font-size="10">产品化、TUI、插件生态不如参考项目成熟</text>
<text x="582" y="814" fill="#6b7280" font-size="10">通用复杂度高，领域科研可解释性需二次设计</text>
<text x="882" y="814" fill="#6b7280" font-size="10">核心不可见，参考价值主要在交互范式</text>
<text x="1182" y="814" fill="#6b7280" font-size="10">DeepSeek-specific，跨厂商抽象弱于通用框架</text>
<text x="80" y="920" fill="#111827" font-size="14" font-weight="600">流程结论：HyperAgent 的流程创新是“实验结果驱动下一轮实验”的科研闭环；需要继续吸收 Reasonix 的事件/回放与 Hermes/Claude 的命令/TUI成熟度。</text>
</svg>