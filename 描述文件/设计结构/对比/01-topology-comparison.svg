<text x="70" y="930" fill="#111827" font-size="14" font-weight="600">结构结论：HyperAgent 的结构差异不在“通用 agent 产品完整度”，而在把 HSI 数据、光谱、模型、训练、评估、论文证据作为一等模块接入 agent loop。</text>
